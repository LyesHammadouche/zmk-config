# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y

# enable deep sleep support
CONFIG_ZMK_SLEEP=y

# the keyboard disconnects from bluetooth.
# uses very little power, but it may take
# a few seconds to reconnect after waking.
# 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# enable soft off behavior
# https://zmk.dev/docs/config/power#soft-off
CONFIG_ZMK_PM_SOFT_OFF=y

# Boost bluetooth transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Tighten host BLE connection interval for lower latency
# Values in 1.25ms units: 6=7.5ms (minimum BLE allows), 12=15ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Tighten split BLE interval (left half → central)
CONFIG_ZMK_SPLIT_BLE_INT_MIN=6
CONFIG_ZMK_SPLIT_BLE_INT_MAX=12

# NKRO for better modifier handling
CONFIG_ZMK_HID_KEYBOARD_NKRO=y

# Reduce debounce for faster key registration
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Tap-dance auto-enabled by ZMK when behavior detected in keymap
